version: 2
updates:
  # GitHub Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - chore
      - github_actions
    groups:
      github-actions:
        patterns:
          - "*"

  # Terraform providers and modules.
  - package-ecosystem: terraform
    directory: /
    schedule:
      interval: weekly
    labels:
      - chore
      - terraform
    groups:
      terraform:
        patterns:
          - "*"
