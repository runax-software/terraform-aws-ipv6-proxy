name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-matrix:
    name: validate-matrix (${{ matrix.tool }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: opentofu
            cmd: tofu
          - tool: terraform
            cmd: terraform
    steps:
      - uses: actions/checkout@v7

      - name: Setup Terraform
        if: matrix.tool == 'terraform'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: latest
          terraform_wrapper: false

      - name: Setup OpenTofu
        if: matrix.tool == 'opentofu'
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: latest

      - name: Format check
        run: ${{ matrix.cmd }} fmt -check -recursive

      - name: Init
        run: ${{ matrix.cmd }} init -backend=false

      - name: Validate
        run: ${{ matrix.cmd }} validate

  # Stable gate so branch protection can require the single "validate" context
  # instead of the per-tool matrix contexts, which leave checks pending forever
  # whenever the matrix changes.
  validate:
    runs-on: ubuntu-latest
    needs: [validate-matrix]
    if: always()
    steps:
      - name: Verify matrix result
        run: |
          if [ "${{ needs.validate-matrix.result }}" != "success" ]; then
            echo "::error::validate-matrix did not succeed (result: ${{ needs.validate-matrix.result }})"
            exit 1
          fi

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest

      - name: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tflint --init

      - name: Run tflint
        run: tflint -f compact
